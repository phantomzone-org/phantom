[workspace]
resolver = "2"
members = [
    "fhevm",
    "compiler",
]

# Workspace-wide dependencies and settings can go here
[workspace.package]

[workspace.dependencies]
poulpy-hal = {version = "0.8.3"}
poulpy-core = {version = "0.8.3"}
poulpy-cpu-ref = {version = "0.8.3", features = ["enable-core"]}
# `enable-avx` requires RUSTFLAGS="-C target-feature=+avx2,+fma"; `enable-rayon`
# adds the rayon-scheduled `FFT64AvxRayon` backend (PHANTOM_BACKEND=fft64-avx-rayon).
poulpy-cpu-avx = {version = "0.8.3", features = ["enable-avx", "enable-rayon"]}
poulpy-bin-fhe = {version = "0.8.3"}